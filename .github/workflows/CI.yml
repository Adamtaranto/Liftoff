name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git history
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.13'
      - name: Install package with dev extras
        run: uv pip install --system -e ".[dev]" types-networkx
      - name: ruff check (and fix)
        # Apply safe autofixes, then fail if anything had to be fixed so that
        # the committed code is always lint-clean.
        run: ruff check --fix --exit-non-zero-on-fix --show-fixes .
      - name: ruff format
        run: ruff format --check --diff .
      - name: mypy
        run: mypy
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          cache-environment: true
      - name: Show versions
        run: |
          python --version
          minimap2 --version
          liftoff --version
      - name: Run pytest
        run: pytest --cov --cov-report=xml
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          files: coverage.xml
          fail_ci_if_error: false
  pyodide:
    name: Test under Pyodide (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          # Must match the Python version of the Pyodide distribution.
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build pure-Python wheel
        run: |
          python -m pip install --upgrade build pyodide-build
          python -m build --wheel
      - name: Create Pyodide virtual environment
        run: |
          pyodide xbuildenv install
          pyodide venv .venv-pyodide
      - name: Install wheel and test dependencies into Pyodide
        run: .venv-pyodide/bin/pip install dist/*.whl pytest
      - name: Run tests that do not need minimap2
        run: .venv-pyodide/bin/python -m pytest -m "not minimap2 and not slow" -p no:cacheprovider
